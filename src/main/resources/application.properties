server.port=8080

spring.application.name=ai-study-rag
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/ai_study_rag?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

rag.embedding.cache-enabled=true
rag.embedding.cache-ttl-days=30
rag.retrieve.cache-enabled=true
rag.retrieve.cache-ttl-minutes=10

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket=${MINIO_BUCKET:ai-study-rag}
storage.minio.presigned-url-expiry-minutes=${MINIO_PRESIGNED_URL_EXPIRY_MINUTES:10}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload.max-size-bytes=52428800
file.upload.allowed-extensions=txt,md,docx,pdf

document.processing.core-pool-size=2
document.processing.max-pool-size=4
document.processing.queue-capacity=100
document.processing.await-termination-seconds=30
document.processing.recovery-enabled=true

llm.base-url=https://open.bigmodel.cn/api/paas/v4/chat/completions
llm.api-key=${ZHIPU_API_KEY}
llm.model=glm-4-flash

openai.embedding.base-url=https://api.siliconflow.cn/v1/embeddings
openai.embedding.api-key=${SILICONFLOW_API_KEY}
openai.embedding.model=BAAI/bge-m3

rag.rerank.enabled=false
rag.rerank.base-url=https://open.bigmodel.cn/api/paas/v4/rerank
rag.rerank.api-key=${ZHIPU_API_KEY}
rag.rerank.model=rerank

rag.vector-index.enabled=true
rag.vector-index.base-url=http://localhost:6333
rag.vector-index.collection-name=document_chunks
rag.vector-index.dimension=1024
rag.vector-index.initialize-on-startup=true
rag.vector-index.distance=Cosine

rag.retrieve.min-final-score=0.2

rag.splitter.semantic-enabled=true
rag.splitter.semantic-threshold=0.65
rag.splitter.chunk-size=500
rag.splitter.overlap=100
rag.splitter.min-paragraph-length=80
rag.splitter.max-paragraph-length=500

rag.chunk-dedup.enabled=true
rag.chunk-dedup.cross-document-enabled=true
rag.chunk-dedup.body-hash-enabled=true
rag.chunk-dedup.near-duplicate-enabled=false
rag.chunk-dedup.near-duplicate-threshold=0.9
rag.chunk-dedup.shingle-size=5
rag.chunk-dedup.min-length=30

rag.context-compression.enabled=false
rag.context-compression.max-sentences-per-chunk=4
rag.context-compression.max-chars-per-chunk=800
rag.context-compression.fallback-chars=200
rag.context-compression.min-keyword-length=2

rag.citation.repair-enabled=true

rag.query-rewrite.enabled=false
rag.query-rewrite.expand-keywords=false
rag.query-rewrite.llm-enabled=false
rag.query-rewrite.llm-base-url=https://open.bigmodel.cn/api/paas/v4/chat/completions
rag.query-rewrite.llm-api-key=${ZHIPU_API_KEY}
rag.query-rewrite.llm-model=glm-4-flash
rag.query-rewrite.llm-timeout-millis=5000
rag.query-rewrite.max-expanded-keywords=8

eval.judge.enabled=true
eval.judge.base-url=${llm.base-url}
eval.judge.api-key=${llm.api-key}
eval.judge.model=${llm.model}
